<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #c0c0c0;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }

  #game-container {
    border: 4px solid;
    border-color: #fff #808080 #808080 #fff;
    background: #c0c0c0;
    padding: 8px;
  }

  #header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
    padding: 6px 8px;
    margin-bottom: 8px;
  }

  .display {
    background: #000;
    color: #f00;
    font-family: 'Courier New', monospace;
    font-size: 24px;
    font-weight: bold;
    padding: 2px 6px;
    min-width: 52px;
    text-align: center;
    border: 2px solid;
    border-color: #808080 #fff #fff #808080;
    letter-spacing: 2px;
  }

  #reset-btn {
    width: 36px;
    height: 36px;
    font-size: 20px;
    cursor: pointer;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #reset-btn:active {
    border-color: #808080 #fff #fff #808080;
    padding: 2px 0 0 2px;
  }

  #board {
    display: grid;
    border: 3px solid;
    border-color: #808080 #fff #fff #808080;
  }

  .cell {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    background: #c0c0c0;
  }

  .cell.revealed {
    border: 1px solid #808080;
    background: #c0c0c0;
    cursor: default;
  }

  .cell.mine-hit {
    background: #f00;
  }

  .cell.flagged { color: #f00; }
  .cell.question { color: #000; }

  .cell[data-n="1"] { color: #0000f0; }
  .cell[data-n="2"] { color: #007b00; }
  .cell[data-n="3"] { color: #f00; }
  .cell[data-n="4"] { color: #00007b; }
  .cell[data-n="5"] { color: #7b0000; }
  .cell[data-n="6"] { color: #007b7b; }
  .cell[data-n="7"] { color: #000; }
  .cell[data-n="8"] { color: #808080; }

  #difficulty {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }

  .diff-btn {
    padding: 4px 10px;
    cursor: pointer;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #808080 #808080 #fff;
    font-family: 'Courier New', monospace;
    font-size: 13px;
  }
  .diff-btn:active, .diff-btn.active {
    border-color: #808080 #fff #fff #808080;
  }

  #status-msg {
    text-align: center;
    font-size: 13px;
    height: 18px;
    margin-top: 6px;
    font-weight: bold;
  }
  #name-row {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
  }
  #name-row input {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    width: 90px;
    padding: 2px 4px;
    border: 2px inset #808080;
    background: #fff;
    text-transform: uppercase;
  }
  #name-row button {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    padding: 2px 8px;
    cursor: pointer;
    background: #c0c0c0;
    border: 2px solid;
    border-color: #fff #808080 #808080 #fff;
  }
  #name-row button:active { border-color: #808080 #fff #fff #808080; }
  #home-btn {
    position: fixed; top: 14px; right: 16px;
    font-size: 0.7rem; letter-spacing: 2px; font-weight: 700;
    color: #555; text-decoration: none; text-transform: uppercase;
    padding: 5px 10px; border: 1px solid #808080; border-radius: 4px;
    transition: color 0.15s, border-color 0.15s;
    background: rgba(192,192,192,0.85); font-family: 'Courier New', monospace;
  }
  #home-btn:hover { color: #007b00; border-color: #007b00; }
  #mine-lb {
    margin-top: 14px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    text-align: center;
  }
  #mine-lb .lb-title {
    font-weight: bold; letter-spacing: 2px; margin-bottom: 6px; color: #333;
  }
  #mine-lb table {
    margin: 0 auto; border-collapse: collapse;
  }
  #mine-lb th, #mine-lb td {
    padding: 2px 10px; text-align: left; border-bottom: 1px solid #c0c0c0;
  }
  #mine-lb th { color: #555; font-size: 10px; }
  #mine-lb .lb-empty { color: #888; font-size: 11px; }
</style>
</head>
<body>

<a id="home-btn" href="index.html">← ARCADE</a>

<div id="difficulty">
  <button class="diff-btn active" data-rows="9"  data-cols="9"  data-mines="10">Beginner</button>
  <button class="diff-btn"        data-rows="16" data-cols="16" data-mines="40">Intermediate</button>
  <button class="diff-btn"        data-rows="16" data-cols="30" data-mines="99">Expert</button>
</div>

<div id="game-container">
  <div id="header">
    <div class="display" id="mine-count">010</div>
    <button id="reset-btn" title="New Game">🙂</button>
    <div class="display" id="timer">000</div>
  </div>
  <div id="board"></div>
  <div id="status-msg"></div>
  <div id="name-row">
    NAME: <input id="name-input" type="text" maxlength="10" placeholder="PLAYER">
    <button id="save-btn">SAVE SCORE</button>
  </div>
</div>
<div id="mine-lb">
  <p class="lb-title">🏆 LEADERBOARD</p>
  <p class="lb-empty">Loading...</p>
</div>

<script>
const board = document.getElementById('board');
const mineDisplay = document.getElementById('mine-count');
const timerDisplay = document.getElementById('timer');
const resetBtn = document.getElementById('reset-btn');
const statusMsg = document.getElementById('status-msg');

let ROWS, COLS, MINES;
let grid, revealed, flagged, questioned;
let gameState; // 'idle' | 'playing' | 'won' | 'lost'
let timerInterval, seconds, firstClick;
let flagCount;
let currentDiff = 'Beginner';

const nameRow   = document.getElementById('name-row');
const nameInput = document.getElementById('name-input');
const saveBtn   = document.getElementById('save-btn');

nameInput.value = localStorage.getItem('arcadeName') || '';
saveBtn.addEventListener('click', submitScore);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitScore(); });

function showNameEntry() {
  nameRow.style.display = 'flex';
  nameInput.focus();
}
function submitScore() {
  const name = arcadeCleanName(nameInput.value);
  localStorage.setItem('arcadeName', name);
  nameRow.style.display = 'none';
  statusMsg.textContent = `You win! Time: ${seconds}s — saved!`;
  if (window.arcadeDB) {
    console.log('[Minesweeper] Pushing score:', name, seconds, currentDiff);
    window.arcadeDB.ref('arcade/minesweeper').push({
      name, time: seconds, difficulty: currentDiff, ts: Date.now()
    }).then(() => {
      console.log('[Minesweeper] Score saved ✓');
      fetchAndRenderLB();
    }).catch(err=>console.error('[Minesweeper] Firebase write failed:', err.message));
  }
}

function fetchAndRenderLB() {
  const el = document.getElementById('mine-lb');
  if (!el) return;
  if (!window.arcadeDB) {
    el.innerHTML = '<p class="lb-empty">Leaderboard unavailable offline</p>';
    return;
  }
  window.arcadeDB.ref('arcade/minesweeper').once('value').then(snap => {
    const rows = [];
    if (snap && snap.exists()) snap.forEach(c => { rows.push(c.val()); }); // braces matter: truthy return stops Firebase forEach
    rows.sort((a,b) => a.time - b.time);
    const top = rows.slice(0, 5);
    const medals = ['🥇','🥈','🥉'];
    if (!top.length) {
      el.innerHTML = '<p class="lb-title">🏆 LEADERBOARD</p><p class="lb-empty">No scores yet — be the first!</p>';
      return;
    }
    let h = '<p class="lb-title">🏆 LEADERBOARD</p><table><thead><tr><th>#</th><th>NAME</th><th>DIFF</th><th>TIME</th></tr></thead><tbody>';
    top.forEach((e,i) => {
      h += `<tr><td>${medals[i]||'#'+(i+1)}</td><td>${arcadeEsc(e.name)}</td><td>${arcadeEsc((e.difficulty||'').slice(0,3).toUpperCase())}</td><td>${arcadeNum(e.time)}s</td></tr>`;
    });
    el.innerHTML = h + '</tbody></table>';
  }).catch(err => {
    console.warn('[Minesweeper] Firebase read failed:', err.message || err);
    el.innerHTML = '<p class="lb-empty">Could not load leaderboard</p>';
  });
}

fetchAndRenderLB();

function fmt(n) {
  const v = Math.min(Math.max(n, -99), 999);
  return v < 0 ? '-' + String(Math.abs(v)).padStart(2, '0')
               : String(v).padStart(3, '0');
}

function initGame(rows, cols, mines) {
  ROWS = rows; COLS = cols; MINES = mines;
  grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
  revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  flagged = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  questioned = Array.from({length: ROWS}, () => Array(COLS).fill(false));
  gameState = 'idle';
  firstClick = true;
  flagCount = 0;
  seconds = 0;
  clearInterval(timerInterval);
  mineDisplay.textContent = fmt(MINES);
  timerDisplay.textContent = '000';
  resetBtn.textContent = '🙂';
  statusMsg.textContent = '';
  renderBoard();
}

function placeMines(safeR, safeC) {
  const candidates = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (Math.abs(r - safeR) > 1 || Math.abs(c - safeC) > 1)
        candidates.push([r, c]);

  // Fisher-Yates shuffle then take first MINES
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }

  for (let i = 0; i < MINES; i++) {
    const [r, c] = candidates[i];
    grid[r][c] = -1;
  }

  // Compute neighbor counts
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] !== -1)
        grid[r][c] = neighbors(r, c).filter(([nr, nc]) => grid[nr][nc] === -1).length;
}

function neighbors(r, c) {
  const result = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++)
      if ((dr || dc) && r+dr >= 0 && r+dr < ROWS && c+dc >= 0 && c+dc < COLS)
        result.push([r+dr, c+dc]);
  return result;
}

function renderBoard() {
  board.style.gridTemplateColumns = `repeat(${COLS}, 28px)`;
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.r = r;
      cell.dataset.c = c;
      cell.addEventListener('click', onLeftClick);
      cell.addEventListener('contextmenu', onRightClick);
      cell.addEventListener('mousedown', onMouseDown);
      cell.addEventListener('mouseup', onMouseUp);
      board.appendChild(cell);
    }
  }
  updateCells();
}

function cellEl(r, c) {
  return board.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function updateCells() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = cellEl(r, c);
      el.className = 'cell';
      el.textContent = '';
      el.removeAttribute('data-n');

      if (flagged[r][c]) {
        el.classList.add('flagged');
        el.textContent = '🚩';
      } else if (questioned[r][c]) {
        el.classList.add('question');
        el.textContent = '?';
      } else if (revealed[r][c]) {
        el.classList.add('revealed');
        const v = grid[r][c];
        if (v === -1) {
          el.textContent = '💣';
        } else if (v > 0) {
          el.textContent = v;
          el.dataset.n = v;
        }
      }
    }
  }
}

function revealCell(r, c) {
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
  if (revealed[r][c] || flagged[r][c]) return;
  revealed[r][c] = true;
  questioned[r][c] = false;

  if (grid[r][c] === 0) {
    neighbors(r, c).forEach(([nr, nc]) => revealCell(nr, nc));
  }
}

function revealAll(hitR, hitC) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const el = cellEl(r, c);
      if (grid[r][c] === -1) {
        if (!flagged[r][c]) {
          revealed[r][c] = true;
        }
        if (r === hitR && c === hitC) {
          el.classList.add('mine-hit');
        }
      } else if (flagged[r][c]) {
        // Wrong flag — show X
        el.classList.add('revealed');
        el.textContent = '❌';
      }
    }
  }
}

function checkWin() {
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      if (grid[r][c] !== -1 && !revealed[r][c]) return false;
  return true;
}

function onLeftClick(e) {
  if (gameState === 'won' || gameState === 'lost') return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (flagged[r][c] || questioned[r][c] || revealed[r][c]) return;

  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
    gameState = 'playing';
    timerInterval = setInterval(() => {
      seconds = Math.min(seconds + 1, 999);
      timerDisplay.textContent = fmt(seconds);
    }, 1000);
  }

  if (grid[r][c] === -1) {
    revealed[r][c] = true;
    revealAll(r, c);
    gameState = 'lost';
    clearInterval(timerInterval);
    resetBtn.textContent = '😵';
    statusMsg.textContent = 'Game over! Right-click to flag, click Reset to play again.';
    updateCells();
    return;
  }

  revealCell(r, c);

  if (checkWin()) {
    gameState = 'won';
    clearInterval(timerInterval);
    resetBtn.textContent = '😎';
    statusMsg.textContent = `You win! Time: ${seconds}s`;
    showNameEntry();
    // Auto-flag remaining mines
    for (let rr = 0; rr < ROWS; rr++)
      for (let cc = 0; cc < COLS; cc++)
        if (grid[rr][cc] === -1) flagged[rr][cc] = true;
    flagCount = MINES;
    mineDisplay.textContent = fmt(0);
  }

  updateCells();
}

function onRightClick(e) {
  e.preventDefault();
  if (gameState === 'won' || gameState === 'lost') return;
  const r = +e.currentTarget.dataset.r;
  const c = +e.currentTarget.dataset.c;
  if (revealed[r][c]) return;

  if (!flagged[r][c] && !questioned[r][c]) {
    flagged[r][c] = true;
    flagCount++;
  } else if (flagged[r][c]) {
    flagged[r][c] = false;
    questioned[r][c] = true;
    flagCount--;
  } else {
    questioned[r][c] = false;
  }

  mineDisplay.textContent = fmt(MINES - flagCount);
  updateCells();
}

// Chord: middle-click or left+right on a revealed numbered cell
function onMouseDown(e) {
  if (e.button === 1) e.preventDefault();
}

function onMouseUp(e) {
  if (gameState === 'won' || gameState === 'lost') return;
  if (e.button === 1) {
    chord(+e.currentTarget.dataset.r, +e.currentTarget.dataset.c);
  }
}

function chord(r, c) {
  if (!revealed[r][c] || grid[r][c] <= 0) return;
  const ns = neighbors(r, c);
  const flaggedCount = ns.filter(([nr, nc]) => flagged[nr][nc]).length;
  if (flaggedCount !== grid[r][c]) return;

  let hitMine = false, hitR, hitC;
  ns.forEach(([nr, nc]) => {
    if (!flagged[nr][nc] && !revealed[nr][nc]) {
      if (grid[nr][nc] === -1) { hitMine = true; hitR = nr; hitC = nc; }
      else revealCell(nr, nc);
    }
  });

  if (hitMine) {
    revealed[hitR][hitC] = true;
    revealAll(hitR, hitC);
    gameState = 'lost';
    clearInterval(timerInterval);
    resetBtn.textContent = '😵';
    statusMsg.textContent = 'Game over!';
  } else if (checkWin()) {
    gameState = 'won';
    clearInterval(timerInterval);
    resetBtn.textContent = '😎';
    statusMsg.textContent = `You win! Time: ${seconds}s`;
    showNameEntry();
    for (let rr = 0; rr < ROWS; rr++)
      for (let cc = 0; cc < COLS; cc++)
        if (grid[rr][cc] === -1) flagged[rr][cc] = true;
    flagCount = MINES;
    mineDisplay.textContent = fmt(0);
  }

  updateCells();
}

resetBtn.addEventListener('click', () => { nameRow.style.display='none'; initGame(ROWS, COLS, MINES); });

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentDiff = btn.textContent;
    nameRow.style.display = 'none';
    initGame(+btn.dataset.rows, +btn.dataset.cols, +btn.dataset.mines);
  });
});

// Start with beginner
initGame(9, 9, 10);
</script>
</body>
</html>
